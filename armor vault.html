<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Armor Vault · 環形戰衣展示庫</title>
<style>
  :root{--cyan:#00f3ff;--ink:#cfeff5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#03060a;overflow:hidden;font-family:"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0;touch-action:none;cursor:grab}
  #app.dragging{cursor:grabbing}
  #app.hover{cursor:pointer}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;z-index:5}
  #title{top:18px;left:20px;letter-spacing:.32em;font-size:12px;opacity:.9}
  #title b{display:block;font-size:20px;letter-spacing:.22em;color:var(--cyan);text-shadow:0 0 12px rgba(0,243,255,.7);margin-bottom:4px;font-weight:600}
  #hint{top:18px;right:20px;text-align:right;font-size:11px;line-height:1.7;opacity:.6;letter-spacing:.08em}
  #info{left:50%;bottom:76px;transform:translate(-50%,20px);width:min(440px,calc(100vw - 32px));padding:14px 18px 16px;
    border:1px solid rgba(0,243,255,.35);background:linear-gradient(180deg,rgba(4,20,28,.78),rgba(2,10,14,.88));
    box-shadow:0 0 24px rgba(0,243,255,.18),inset 0 0 20px rgba(0,243,255,.06);backdrop-filter:blur(6px);
    opacity:0;transition:opacity .45s,transform .45s}
  #info.show{opacity:1;transform:translate(-50%,0)}
  #info .code{font-size:11px;letter-spacing:.3em;color:var(--cyan);opacity:.8}
  #info h2{font-size:20px;letter-spacing:.14em;margin:2px 0 6px;font-weight:600}
  #info p{font-size:12.5px;line-height:1.6;opacity:.8;margin-bottom:10px}
  .bar{display:flex;align-items:center;gap:10px;font-size:10.5px;letter-spacing:.18em;margin-top:5px}
  .bar span{width:54px;opacity:.7}
  .bar i{flex:1;height:4px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
  .bar i::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--c,var(--cyan));box-shadow:0 0 8px var(--c,var(--cyan))}
  #nav{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-wrap:nowrap;justify-content:center;gap:8px;z-index:6;width:min(820px,calc(100vw - 16px))}
  #nav button{pointer-events:auto;width:48px;height:42px;border:1px solid rgba(0,243,255,.4);background:rgba(3,16,22,.7);color:var(--cyan);
    font-size:16px;cursor:pointer;backdrop-filter:blur(4px);transition:.2s}
  #nav button:hover{background:rgba(0,243,255,.18);box-shadow:0 0 14px rgba(0,243,255,.4)}
  #nav .lbtn{flex:1 1 0;width:auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 8px;font-size:12px;letter-spacing:.1em;white-space:nowrap}
  .lt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
  .lt small{font-size:9px;opacity:.65;letter-spacing:.12em}
  .lt b{font-weight:500;font-size:12px}
  .pips{display:flex;gap:3px}
  .pips i{width:7px;height:14px;background:rgba(0,243,255,.18);transition:.25s}
  .pips i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03060a;z-index:20;
    letter-spacing:.4em;font-size:12px;color:var(--cyan);transition:opacity .8s}
  #loading.off{opacity:0;pointer-events:none}
  @media(max-width:600px){#hint{display:none}}
  @media(max-width:520px){
    #nav{gap:6px}
    #nav button{width:38px}
    #nav{width:calc(100vw - 16px)}
    #nav .lbtn{flex:1 1 0;min-width:0;padding:0 4px;gap:4px;letter-spacing:.02em}
    .lt small{font-size:8px;letter-spacing:0}
    .lt b{font-size:11px}
    .pips{gap:2px}
    .pips i{width:4px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title"><b>ARMOR VAULT</b>環形戰衣展示庫</div>
<div class="hud" id="hint">左右滑動 / ← → 旋轉機庫<br>點擊展示櫃拉近，左右滑動切換<br>下滑 / Esc 返回中央平台<br>雙指縮放 / 滾輪 / ↑ ↓ 拉進拉遠展示庫<br>L 平台 / J 斜角 / K 展示櫃 / H 展示庫燈光（或下方按鈕）</div>
<div class="hud" id="info"><div class="code" id="iCode"></div><h2 id="iName"></h2><p id="iDesc"></p><div id="iBars"></div></div>
<div id="nav">
  <button class="lbtn" id="bLight" title="平台燈光（L）"><span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="lt"><small>平台燈光</small><b id="lName">明亮</b></span></button>
  <button class="lbtn" id="bPanel" title="斜角燈光（J）"><span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="lt"><small>斜角燈光</small><b id="sName">明亮</b></span></button>
  <button class="lbtn" id="bPod" title="展示櫃燈光（K）"><span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="lt"><small>展示櫃燈光</small><b id="pName">明亮</b></span></button>
  <button class="lbtn" id="bHall" title="展示庫燈光（H）"><span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="lt"><small>展示庫燈光</small><b id="hName">明亮</b></span></button>
</div>
<div id="loading">LOADING VAULT…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  if(typeof THREE==="undefined"){
    document.getElementById("loading").textContent="無法載入 Three.js，請檢查網路連線";
    return;
  }
  var TAU=Math.PI*2, CYAN=0x00f3ff;
  var R=11;                       // 展示櫃所在圓弧半徑
  var app=document.getElementById("app");

  /* ---------- Renderer / Scene / Camera ---------- */
  var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  app.appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x03060a);
  scene.fog=new THREE.FogExp2(0x04080d,0.026);

  var camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,120);
  var ZDEF=11;   // 預設鏡頭距離（拉遠）
  var camFree=new THREE.Vector3(0,3.6,ZDEF), lookFree=new THREE.Vector3(0,2.5,-9);
  // 依螢幕寬高比調整視角，讓預設畫面剛好容納 3 個展示櫃（左右展示櫃外緣約 ±7.6）
  function fitFov(){
    var a=innerWidth/innerHeight;
    var vHalf=Math.atan(Math.tan(Math.atan(7.6/(ZDEF+R)))/a);
    camera.fov=Math.max(32,Math.min(82,vHalf*2*180/Math.PI));
    camera.aspect=a; camera.updateProjectionMatrix();
  }
  var camFocus=new THREE.Vector3(0,2.9,-R+7.6), lookFocus=new THREE.Vector3(0,2.7,-R);
  var camPos=camFree.clone(), look=lookFree.clone();
  fitFov();
  camera.position.copy(camPos); camera.lookAt(look);

  var hall=new THREE.Group(); scene.add(hall);

  /* ---------- Texture helpers ---------- */
  function canvasTex(w,h,draw,rep){
    var c=document.createElement("canvas"); c.width=w; c.height=h;
    draw(c.getContext("2d"),w,h);
    var t=new THREE.CanvasTexture(c);
    t.encoding=THREE.sRGBEncoding; t.anisotropy=4;
    if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]);}
    return t;
  }
  function concreteTex(rx,ry,base){
    return canvasTex(512,512,function(g,w,h){
      g.fillStyle=base||"#2b3035"; g.fillRect(0,0,w,h);
      var id=g.getImageData(0,0,w,h);
      for(var i=0;i<id.data.length;i+=4){
        var n=(Math.random()-.5)*34;
        id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n+2;
      }
      g.putImageData(id,0,0);
      for(var k=0;k<40;k++){
        var x=Math.random()*w,y=Math.random()*h,r=30+Math.random()*90;
        var gr=g.createRadialGradient(x,y,0,x,y,r);
        gr.addColorStop(0,Math.random()<.5?"rgba(0,0,0,.25)":"rgba(255,255,255,.07)");
        gr.addColorStop(1,"rgba(0,0,0,0)");
        g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);
      }
      g.strokeStyle="rgba(0,0,0,.35)"; g.lineWidth=2;
      g.strokeRect(1,1,w-2,h-2);
    },[rx,ry]);
  }
  function gridTex(rep){
    return canvasTex(128,128,function(g,w,h){
      g.fillStyle="#15181c"; g.fillRect(0,0,w,h);
      g.strokeStyle="#39414a"; g.lineWidth=2;
      for(var i=-h;i<w+h;i+=16){
        g.beginPath(); g.moveTo(i,0); g.lineTo(i+h,h); g.stroke();
        g.beginPath(); g.moveTo(i,h); g.lineTo(i+h,0); g.stroke();
      }
      g.fillStyle="#07090b";
      for(var x=8;x<w;x+=16)for(var y=8;y<h;y+=16){g.beginPath();g.arc(x,y,2.2,0,TAU);g.fill();}
    },[rep,rep]);
  }
  function slatTex(){
    return canvasTex(256,512,function(g,w,h){
      g.fillStyle="#0b1015"; g.fillRect(0,0,w,h);
      for(var y=18;y<h;y+=26){
        var gr=g.createLinearGradient(0,y,w,y);
        gr.addColorStop(0,"rgba(120,200,220,.05)"); gr.addColorStop(.5,"rgba(170,230,245,.75)"); gr.addColorStop(1,"rgba(120,200,220,.05)");
        g.fillStyle=gr; g.fillRect(0,y,w,4);
      }
    });
  }
  var glowTex=canvasTex(128,128,function(g,w,h){
    var gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.3,"rgba(120,230,255,.45)"); gr.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  });
  var beamTexSoft=canvasTex(64,256,function(g,w,h){
    var id=g.createImageData(w,h), d=id.data;
    function sm(x){x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x);}
    for(var y=0;y<h;y++){
      var t=y/(h-1);                                   // 0＝頂端、1＝底端
      var av=.8*Math.pow(t,2.2);                       // 垂直：頂端透明、向底端平滑增強
      for(var x=0;x<w;x++){
        var u=x/(w-1);
        var ex=Math.min(u,1-u), ah;                    // 水平分三段（ex＝離最近邊緣的比例）：
        if(ex<.15) ah=.45*sm(ex/.15);                  //   最外 15%：羽化 0→.45
        else if(ex<.29) ah=.45+.55*sm((ex-.15)/.14);   //   次外 14%：過渡 .45→1
        else ah=1;                                     //   中央 42%：實心
        var i=(y*w+x)*4;
        d[i]=255; d[i+1]=255; d[i+2]=255; d[i+3]=Math.round(255*av*ah);
      }
    }
    g.putImageData(id,0,0);
  });
  var beamTex=canvasTex(8,256,function(g,w,h){
    var gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,"rgba(0,243,255,0)"); gr.addColorStop(.55,"rgba(0,243,255,.18)"); gr.addColorStop(1,"rgba(120,250,255,.75)");
    g.fillStyle=gr; g.fillRect(0,0,w,h);
  });
  function labelTex(text){
    return canvasTex(256,48,function(g,w,h){
      g.fillStyle="#06090c"; g.fillRect(0,0,w,h);
      g.strokeStyle="rgba(0,243,255,.6)"; g.lineWidth=2; g.strokeRect(2,2,w-4,h-4);
      g.fillStyle="#7ff7ff"; g.font="600 24px Consolas,monospace"; g.textAlign="center"; g.textBaseline="middle";
      g.fillText(text,w/2,h/2+1);
    });
  }
  function glowMat(map,color,op){
    return new THREE.MeshBasicMaterial({map:map,color:color,transparent:true,opacity:op==null?1:op,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
  }

  /* ---------- Floor / Wall / Ceiling ---------- */
  // 材質底色偏亮，實際明暗由「展示庫燈光」控制（見 tick）
  var floorMat=new THREE.MeshStandardMaterial({map:concreteTex(9,9,"#5c646b"),color:0xffffff,metalness:.35,roughness:.6});
  var floor=new THREE.Mesh(new THREE.CircleGeometry(40,64),floorMat);
  floor.rotation.x=-Math.PI/2; hall.add(floor);

  var wallTex=concreteTex(8,1.6,"#6d767d");
  var wallMat=new THREE.MeshStandardMaterial({map:wallTex,color:0xffffff,roughness:.9,metalness:.1,side:THREE.BackSide});
  var wall=new THREE.Mesh(new THREE.CylinderGeometry(R+3,R+3,14,72,1,true),wallMat);
  wall.position.y=7; hall.add(wall);

  var ceilMat=new THREE.MeshStandardMaterial({color:0x0b0e12,roughness:1,side:THREE.DoubleSide});
  var ceil=new THREE.Mesh(new THREE.CircleGeometry(R+3,48),ceilMat);
  ceil.rotation.x=Math.PI/2; ceil.position.y=14; hall.add(ceil);

  // 機庫結構：牆面立柱、橫向金屬帶、青色飾條
  var ribMat=new THREE.MeshStandardMaterial({color:0x4a535b,metalness:.6,roughness:.5});
  for(var q0=0;q0<36;q0++){
    var aq0=q0*TAU/36;
    var rib=new THREE.Mesh(new THREE.BoxGeometry(.4,13.6,.3),ribMat);
    rib.position.set(Math.sin(aq0)*(R+2.85),6.9,Math.cos(aq0)*(R+2.85));
    rib.rotation.y=aq0; hall.add(rib);
  }
  [1.1,12.9].forEach(function(yy){
    var band=new THREE.Mesh(new THREE.TorusGeometry(R+2.8,.11,8,120),ribMat);
    band.rotation.x=Math.PI/2; band.position.y=yy; hall.add(band);
  });
  var trimMat=new THREE.MeshBasicMaterial({color:CYAN,toneMapped:false});
  var trim=new THREE.Mesh(new THREE.TorusGeometry(R+2.74,.035,6,120),trimMat);
  trim.rotation.x=Math.PI/2; trim.position.y=11.6; hall.add(trim);

  // 天花板燈具
  var lampMat=new THREE.MeshBasicMaterial({color:0xdfefff,toneMapped:false});
  [[8,20],[12.4,26]].forEach(function(c){
    for(var q=0;q<c[1];q++){
      var aq=q*TAU/c[1];
      var lp=new THREE.Mesh(new THREE.BoxGeometry(1.5,.08,.5),lampMat);
      lp.position.set(Math.sin(aq)*c[0],13.92,Math.cos(aq)*c[0]);
      lp.rotation.y=aq; hall.add(lp);
    }
  });
  var lampRing=new THREE.Mesh(new THREE.TorusGeometry(4,.14,8,96),lampMat);
  lampRing.rotation.x=Math.PI/2; lampRing.position.y=13.85; hall.add(lampRing);

  // 地面導軌：同心環 + 放射線
  function ring(r0,r1,y,mat,seg,ts,tl){
    var m=new THREE.Mesh(new THREE.RingGeometry(r0,r1,seg||96,1,ts||0,tl||TAU),mat);
    m.rotation.x=-Math.PI/2; m.position.y=y; return m;
  }
  var trackMat=new THREE.MeshBasicMaterial({color:CYAN,transparent:true,opacity:.35,fog:true});
  hall.add(ring(R-1.55,R-1.5,.012,trackMat));
  hall.add(ring(6.1,6.14,.012,trackMat));
  var plateMat=new THREE.MeshStandardMaterial({color:0x0f1216,metalness:.8,roughness:.4});
  for(var i=0;i<12;i++){
    var a=i*TAU/12;
    var b=new THREE.Mesh(new THREE.BoxGeometry(.18,.02,R-5.2),plateMat);
    b.position.set(Math.sin(a)*((R+4.2)/2-.4),.012,Math.cos(a)*((R+4.2)/2-.4));
    b.rotation.y=a; hall.add(b);
  }
  // 牆底與天花板光環
  var wallRingMat=new THREE.MeshBasicMaterial({color:CYAN,transparent:true,opacity:.5});
  var wr=ring(R+2.9,R+2.97,.05,wallRingMat); hall.add(wr);
  var cr=new THREE.Mesh(new THREE.TorusGeometry(R-1,.05,8,120),new THREE.MeshBasicMaterial({color:0x9fefff,transparent:true,opacity:.35}));
  cr.rotation.x=Math.PI/2; cr.position.y=13.5; hall.add(cr);

  /* ---------- Central platform ---------- */
  // 整座平台抬高：與地面（展示庫地板）產生高低差。場景尺寸約 1 單位≈0.45 m，0.3 單位≈13–15 cm
  var LIFT=.3;
  var platform=new THREE.Group(); platform.position.y=LIFT; hall.add(platform);
  var metalDark=new THREE.MeshStandardMaterial({color:0x1b1f24,metalness:.9,roughness:.35});
  var metalMid=new THREE.MeshStandardMaterial({color:0x2c3138,metalness:.9,roughness:.3});
  var gTex=gridTex(7);
  var gridMat=new THREE.MeshStandardMaterial({map:gTex,color:0xcfd6dc,metalness:.8,roughness:.45});

  var ledMat=new THREE.MeshBasicMaterial({color:CYAN,toneMapped:false});
  var ledSoft=new THREE.MeshBasicMaterial({color:0x60f6ff,toneMapped:false});
  var padMat=new THREE.MeshBasicMaterial({color:0x9fe8ff,toneMapped:false});   // 白藍色 LED 環面板
  var padMat2=new THREE.MeshBasicMaterial({color:0x9fe8ff,toneMapped:false});  // 斜角 LED 面板（獨立控制）

  // 碳纖維編織材質：腳下網狀平台 / 平台周圍地板
  function weaveTex(rep){
    return canvasTex(128,128,function(g,w,h){
      g.fillStyle="#101215"; g.fillRect(0,0,w,h);
      var c=16;
      for(var yy=0;yy<h/c;yy++)for(var xx=0;xx<w/c;xx++){
        var horiz=((xx+yy)%2===0);
        var gr=horiz?g.createLinearGradient(xx*c,yy*c,xx*c,yy*c+c):g.createLinearGradient(xx*c,yy*c,xx*c+c,yy*c);
        gr.addColorStop(0,"#2a2f35"); gr.addColorStop(.5,"#505962"); gr.addColorStop(1,"#1a1d21");
        g.fillStyle=gr; g.fillRect(xx*c+1,yy*c+1,c-2,c-2);
      }
    },[rep,rep]);
  }
  var weaveA=weaveTex(5), weaveB=weaveTex(12);
  var meshMat=new THREE.MeshStandardMaterial({map:weaveA,bumpMap:weaveA,bumpScale:2.2,metalness:.75,roughness:.45});
  var carbonFloorMat=new THREE.MeshStandardMaterial({map:weaveB,bumpMap:weaveB,bumpScale:1.5,color:0xb8c0c8,metalness:.6,roughness:.55});
  var boltMat=new THREE.MeshStandardMaterial({color:0x7d8791,metalness:.95,roughness:.3});
  var boltGeo=new THREE.CylinderGeometry(.05,.055,.05,8);
  function bolt(parent,x,y,z){var b=new THREE.Mesh(boltGeo,boltMat); b.position.set(x,y,z); parent.add(b);}

  // 平台周圍的碳纖維地板與外緣滾邊
  var cf=new THREE.Mesh(new THREE.CircleGeometry(6.05,72),carbonFloorMat);
  cf.rotation.x=-Math.PI/2; cf.position.y=.018; platform.add(cf);
  var cfEdge=new THREE.Mesh(new THREE.TorusGeometry(6.08,.045,6,96),metalMid);
  cfEdge.rotation.x=Math.PI/2; cfEdge.position.y=.04; platform.add(cfEdge);
  // 碳纖維圓盤的側裙與下緣滾邊（抬高後露出的厚度）
  var skirtH=LIFT+.02;
  var skirt=new THREE.Mesh(new THREE.CylinderGeometry(6.08,6.1,skirtH,96,1,true),metalDark);
  skirt.position.y=(.02-LIFT)/2; platform.add(skirt);
  var skirtBase=new THREE.Mesh(new THREE.TorusGeometry(6.1,.04,6,96),metalMid);
  skirtBase.rotation.x=Math.PI/2; skirtBase.position.y=-LIFT+.04; platform.add(skirtBase);
  var underside=new THREE.Mesh(new THREE.CircleGeometry(6.08,72),new THREE.MeshBasicMaterial({color:0x020304,side:THREE.DoubleSide}));
  underside.rotation.x=-Math.PI/2; underside.position.y=-LIFT+.03; platform.add(underside);

  function tier(r0,r1,h,y,mats){
    var m=new THREE.Mesh(new THREE.CylinderGeometry(r0,r1,h,64),mats);
    m.position.y=y; platform.add(m); return m;
  }
  tier(3.62,3.7,.1,.07,[metalDark,metalMid,metalDark]);     // 底部滾邊
  tier(3.3,3.5,.54,.31,[metalMid,metalDark,metalDark]);      // 平台本體（由地面直接升起）
  tier(2.5,2.7,.3,.73,[metalDark,gridMat,metalDark]);
  tier(2.15,2.25,.2,.98,[metalMid,metalMid,metalDark]);
  // 邊緣金屬環
  [[3.52,.04,.58],[2.72,.04,.88]].forEach(function(t){
    var tr=new THREE.Mesh(new THREE.TorusGeometry(t[0],t[1],8,96),metalMid);
    tr.rotation.x=Math.PI/2; tr.position.y=t[2]; platform.add(tr);
  });

    }
    bdGeo.attributes.position.needsUpdate=true;
    holo.children.forEach(function(r){r.rotation.z+=r.userData.sp*dt;});
    holo.rotation.y+=dt*.3;
    wallRingMat.opacity=(.4+.15*Math.sin(t*1.3))*HLL;

    // 展示櫃
    for(var i=0;i<pods.length;i++){
      var p=pods[i];
      // 環繞時避免被展示櫃擋住：位於「鏡頭與中央平台之間」視線錐內的展示櫃會往地面下沉隱藏，移開後再升起
      p.group.getWorldPosition(pw);
      var vx=pw.x-camera.position.x, vz=pw.z-camera.position.z, ccx=-camera.position.x, ccz=-camera.position.z;
      var dp=Math.hypot(vx,vz), dc=Math.hypot(ccx,ccz);
      var cosA=(vx*ccx+vz*ccz)/(dp*dc+1e-6), blocking=(i!==focus && ((dp<dc+1.0 && cosA>.85) || dp<4.2));   // 偏離視線約 31° 以內
      p.vis+=((blocking?0:1)-p.vis)*Math.min(1,dt*6);
      p.group.scale.y=Math.max(.001,p.vis);
      var tf=i===focus?1:0, th=i===hoverIdx?1:0;
      p.focus+=(tf-p.focus)*Math.min(1,dt*4);
      p.hover+=(th-p.hover)*Math.min(1,dt*6);
      var pl=.88+.12*Math.sin(t*1.8+p.phase);
      var boost=1+p.focus*.7+p.hover*.35, m=LV.pod, mL=LV.podL;
      c1.copy(stripBase).lerp(FLUOR,LV.flD).multiplyScalar(pl*boost*(.85+.35)*mL);
      p.stripMat.color.copy(c1);
      p.topMat.color.set(0xeaffff).multiplyScalar(m);
      p.backMat.emissiveIntensity=.7*m;
      p.plateMat.opacity=.55*m;
      if(p.spot) p.spot.intensity=(2.3+.3*Math.sin(t*1.4+p.phase))*(1+p.focus*.8+p.hover*.4)*m*p.vis;
      p.coneMat.opacity=(.045+.03*p.focus+.02*p.hover)*m;
      for(var g=0;g<p.glows.length;g++) p.glows[g].material.opacity=(.4+.12*Math.sin(t*1.8+p.phase))*(1+p.focus*.5)*mL;
    }

    // 微塵
    var pa=dgeo.attributes.position.array;
    for(var d=0;d<DN;d++){
      pa[d*3+1]+=dt*.12; pa[d*3]+=Math.sin(t*.3+d)*dt*.03;
      if(pa[d*3+1]>11) pa[d*3+1]=0;
    }
    dgeo.attributes.position.needsUpdate=true;

    renderer.render(scene,camera);
    requestAnimationFrame(tick);
  }
  tick();
  setTimeout(function(){document.getElementById("loading").classList.add("off");},400);
})();
</script>

</html>
